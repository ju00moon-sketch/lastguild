<script>
const gallery = document.getElementById('gallery');
document.getElementById('empty').hidden = gallery.children.length !== 0;
for (const image of gallery.querySelectorAll('img')) {
  const status = image.nextElementSibling;
  const loaded = () => { status.hidden = true; };
  const failed = () => {
    status.hidden = false;
    status.removeAttribute('aria-hidden');
    status.textContent = '이미지를 불러오지 못했습니다. 눌러서 큰 그림을 다시 열어 주세요.';
  };
  image.addEventListener('load', loaded);
  image.addEventListener('error', failed);
  if (image.complete) { image.naturalWidth ? loaded() : failed(); }
}
</script>
<noscript><style>.status{display:none!important}</style></noscript>
